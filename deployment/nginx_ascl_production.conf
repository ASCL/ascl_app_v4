#
# ASCL.net Production Deployment - Nginx Configuration
#
# This configuration proxies to the Flask app running on port 5050.
# It's designed for deployment on a development server before final migration to cPanel/Apache.
#
# Installation:
#   1. Copy this file to: /etc/nginx/sites-available/ascl_production
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/ascl_production /etc/nginx/sites-enabled/
#   3. Test config: sudo nginx -t
#   4. Reload Nginx: sudo systemctl reload nginx
#
# NOTE: This is a temporary production setup. Final deployment will use cPanel/Apache.
#

upstream ascl_production {
    # Uvicorn server on port 5050
    # Using a single upstream since we're running Uvicorn with multiple workers
    server 127.0.0.1:5050 fail_timeout=0;
}

server {
    listen      80;
    server_name ascl.bistromath.net;

    # Separate logs for production deployment
    error_log /var/log/nginx/ascl_production_error.log error;
    access_log /var/log/nginx/ascl_production_access.log;

    # Maximum upload size
    client_max_body_size 10M;

    # Proxy all requests to Uvicorn
    location / {
        proxy_pass http://ascl_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Serve static files directly from Nginx for better performance
    # Adjust path to match your actual static files location
    location /static/ {
        alias /var/www/ascl_net_app/ascl_net_app/static/;
        expires 7d;  # Shorter cache for development
        add_header Cache-Control "public";
        access_log off;
    }

    # Don't log favicon requests
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Don't log Apple touch icons
    location = /apple-touch-icon.png {
        log_not_found off;
        access_log off;
    }

    location = /apple-touch-icon-precomposed.png {
        log_not_found off;
        access_log off;
    }

    # Don't log robots.txt requests
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Security: deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

