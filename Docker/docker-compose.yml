services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql_ascl_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ascl_root_dev_password
      MYSQL_USER: ascl_db
      MYSQL_PASSWORD: ascl_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_ascl_dev_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_ascl_dev_data:
