#
# ascl_net_app web app server (Nginx + Uvicorn)
#
# Place this file in: /etc/nginx/sites-available/ascl_net_app
# Enable with: sudo ln -s /etc/nginx/sites-available/ascl_net_app /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx
#

upstream ascl_app {
    # Uvicorn server(s)
    # For multiple workers, add more servers here for load balancing
    server 127.0.0.1:8000 fail_timeout=0;
    # server 127.0.0.1:8001 fail_timeout=0;
    # server 127.0.0.1:8002 fail_timeout=0;
}

server {
    listen      80;
    server_name ascl.net www.ascl.net;

    # Create separate logs for this server.
    error_log /var/log/nginx/ascl_net_app_error.log error;
    access_log /var/log/nginx/ascl_net_app_access.log;

    # Maximum upload size
    client_max_body_size 10M;

    # Location directive ref: http://wiki.nginx.org/NginxHttpCoreModule#location

    # Proxy all requests to Uvicorn
    location / {
        proxy_pass http://ascl_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static files directly from Nginx for better performance
    location /static/ {
        alias /var/www/ascl_net_app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

	# serve favicon directly from nginx
	location = /favicon.ico {
		alias /var/www/ascl_net_app/static/images/favicon.ico;
		log_not_found off;
		access_log off;
	}

    location = /apple-touch-icon.png {
        log_not_found off;
        access_log off;
    }

    location = /apple-touch-icon-precomposed.png {
        log_not_found off;
        access_log off;
    }

	# serve robots.txt directly from nginx
	location = /robots.txt {
		alias /var/www/ascl_net_app/static/robots.txt;
		allow all;
		log_not_found off;
		access_log off;
	}

    #location ~* \.(html|png|js|css)$ {
    #	root /var/www/ascl_net_app_webapp/docs;
    #}

	# location = /favicon.ico { alias /var/www/favicon.ico; }

    error_page  404              /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}