#
# Dev cPanel configuration (devascl server).
#
# Usage:
#   export FLASK_CONFIG=devascl_net.cfg
#   python run_ascl_net_app.py
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

LOG_SQL_QUERIES = False
ENABLE_COLOR_LOGS = False

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True
DB_TYPE = 'mysql'

DB_DATABASE = 'devascl_db_v4'
DB_HOST = 'localhost'
DB_USER = 'devascl_user'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf
DB_PORT = '3306'

# WordPress database (read-only, same MySQL instance)
WP_DB_DATABASE = 'devascl_wordpress'
WP_DB_HOST = 'localhost'
WP_DB_USER = 'devascl_user'
WP_DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf
WP_DB_PORT = '3306'

USING_POSTGRESQL = False
USING_MYSQL = True

# ------------------------------
# Typesense
# ------------------------------
USING_TYPESENSE = True
TYPESENSE_URL = 'https://ascl.bistromath.net/typesense'
TYPESENSE_COLLECTION = 'codes'
TYPESENSE_FALLBACK_TO_MYSQL = True

# ------------------------------
# Server settings
# ------------------------------
USING_SENTRY = False
SENTRY_DSN = ''
USING_UVICORN = False  # cPanel — not using Uvicorn

SESSION_COOKIE_SECURE = False
SESSION_COOKIE_HTTPONLY = True
SESSION_COOKIE_SAMESITE = 'Lax'
