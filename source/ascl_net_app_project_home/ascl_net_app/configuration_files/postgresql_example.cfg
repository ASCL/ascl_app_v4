#
# PostgreSQL configuration example
#
# Copy this to create your own PostgreSQL configuration:
#   cp postgresql_example.cfg my_postgresql.cfg
#
# Then start the app with:
#   export FLASK_CONFIG=my_postgresql.cfg
#   python run_ascl_net_app.py --debug
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# log raw SQL queries (useful for debugging)
LOG_SQL_QUERIES = False

ENABLE_COLOR_LOGS = True

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True

# Database type: 'mysql' or 'postgresql'
DB_TYPE = 'postgresql'

# ------------------------------
# PostgreSQL Connection Parameters
# ------------------------------
DB_DATABASE = 'ascl_db'
DB_HOST = 'localhost'
DB_USER = 'ascl_user'
DB_PASSWORD = ''  # Leave empty to use ~/.pgpass, or set password here
DB_PORT = '5432'

# Legacy flags (kept for backwards compatibility)
USING_POSTGRESQL = True
USING_MYSQL = False

# ---------------------------------------------------------------------
# Additional PostgreSQL-specific notes
# ---------------------------------------------------------------------

# For password-free authentication, create ~/.pgpass with format:
#   hostname:port:database:username:password
# Then: chmod 600 ~/.pgpass

# PostgreSQL connection options can be passed via the connection string
# For example: postgresql://user:pass@host:port/db?sslmode=require

# ---------------------------------------------------------------------
# Other settings
# ---------------------------------------------------------------------

USING_SENTRY = False
SENTRY_DSN = "insert your Sentry DSN here, e.g. 'https://...'"
USING_UVICORN = True
