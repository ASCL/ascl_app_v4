#
# Default configuration file.
#
# This file is ALWAYS loaded first. Host-specific config files
# (trillian2.cfg, ascl.cfg, ascl_dev.cfg) override values as needed.
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# leave as default (localhost:5000)
#SERVER_NAME = 'localhost:5000'

# Secret key for session management (required for Flask sessions)
# In production, override via /etc/ascl/secrets.cfg
SECRET_KEY = 'dev-secret-key-change-in-production-a8f2k9d3m5n7p1q4'

# ------------------------------
# Logging configuration
# ------------------------------
LOG_SQL_QUERIES = False
ENABLE_COLOR_LOGS = True

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True
DB_TYPE = 'mysql'

DB_DATABASE = 'ascl_db_v4'
DB_HOST = 'localhost'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf (MySQL) or ~/.pgpass (PostgreSQL)
DB_PORT = '3307'

# WordPress database (read-only)
WP_DB_DATABASE = 'ascl_wordpress'
WP_DB_HOST = 'localhost'
WP_DB_USER = 'ascl_root'
WP_DB_PASSWORD = ''
WP_DB_PORT = '3307'

USING_POSTGRESQL = False
USING_MYSQL = True

# ------------------------------
# Typesense Search Configuration
# ------------------------------
USING_TYPESENSE = True
TYPESENSE_URL = 'http://127.0.0.1:8108'
TYPESENSE_HOST = 'localhost'
TYPESENSE_PORT = 8108
TYPESENSE_PROTOCOL = 'http'
TYPESENSE_API_KEY = 'dev-typesense-key-override-in-secrets-cfg'
TYPESENSE_COLLECTION = 'codes'
TYPESENSE_FALLBACK_TO_MYSQL = True

# ------------------------------
# Icecave Archive API
# ------------------------------
ICECAVE_API_URL = 'http://127.0.0.1:5001'
ICECAVE_API_KEY = ''  # Set in secrets.cfg for production

# ------------------------------
# Production features (off by default)
# ------------------------------
USING_SENTRY = False
SENTRY_DSN = ''
USING_UVICORN = True
