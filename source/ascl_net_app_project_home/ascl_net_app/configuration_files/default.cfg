#
# This is the default configuration file.
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# leave as default (localhost:5000)
#SERVER_NAME = 'localhost:5000'

# ------------------------------
# Logging configuration
# ------------------------------

# Log all SQL queries to console and log file
# WARNING: Very verbose! Only enable for debugging
# See LOGGING.md for details
LOG_SQL_QUERIES = False

# Enable colored console output (automatically disabled when output is redirected)
# Set to False to disable colors
ENABLE_COLOR_LOGS = True

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True

# Database type: 'mysql' or 'postgresql'
DB_TYPE = 'mysql'

# Database connection parameters
DB_DATABASE = 'ascl_db'
DB_HOST = 'localhost'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf (MySQL) or ~/.pgpass (PostgreSQL)
DB_PORT = '3307'  # ASCL Docker MySQL: 3307, PostgreSQL default: 5432

# WordPress database (read-only)
WP_DB_DATABASE = 'ascl_wordpress'
WP_DB_HOST = 'localhost'
WP_DB_USER = 'ascl_root'  # Leave password empty to use ~/.my.cnf (e.g., [client_ascl_root])
WP_DB_PASSWORD = ''
WP_DB_PORT = '3307'

# Legacy flags (kept for backwards compatibility)
USING_POSTGRESQL = False
USING_MYSQL = True

# ------------------------------
# Typesense Search Configuration
# ------------------------------
USING_TYPESENSE = True  # Enable Typesense search (falls back to MySQL if unavailable)

# Typesense server connection
TYPESENSE_HOST = 'localhost'
TYPESENSE_PORT = 8108
TYPESENSE_PROTOCOL = 'http'  # 'http' or 'https'
TYPESENSE_API_KEY = 'oWBN1v9zT9C3ZM48gblWobm4ibxcrFcn11hGpb3HiPzT9UOL'

# Typesense collection name
TYPESENSE_COLLECTION = 'codes'

# Search fallback behavior
TYPESENSE_FALLBACK_TO_MYSQL = True  # If True, falls back to MySQL LIKE search when Typesense is unavailable

# ---------------------------------------------------------------------
# These options only apply when the app is served in production mode.
# ---------------------------------------------------------------------

USING_SENTRY	= False
SENTRY_DSN		= "insert your Sentry DSN here, e.g. 'https://...'"
USING_UVICORN	= True
