#
# Production configuration file.
#
# This configuration is used when running under Uvicorn in production mode.
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# Set this to your production domain
#SERVER_NAME = 'ascl.net'

# Disable SQL query logging in production for performance
LOG_SQL_QUERIES = False

# Disable color logs in production (logs should be plain text)
ENABLE_COLOR_LOGS = False

# Enable database connections
USING_SQLALCHEMY = True

# Database type: 'mysql' or 'postgresql'
DB_TYPE = 'mysql'

# ------------------------------
# Database connection parameters
# ------------------------------
# IMPORTANT: Configure these for your production database
# For security, consider using environment variables or a secrets manager
# For MySQL: Leave DB_PASSWORD empty to use ~/.my.cnf
# For PostgreSQL: Leave DB_PASSWORD empty to use ~/.pgpass

DB_DATABASE = 'ascl_db_v4'
DB_HOST = 'localhost'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Empty string uses ~/.my.cnf [client_ascl] group
DB_PORT = '3307'  # ASCL Docker MySQL on port 3307

# WordPress database (read-only)
WP_DB_DATABASE = 'ascl_wordpress'
WP_DB_HOST = 'localhost'
WP_DB_USER = 'ascl_root'  # Leave password empty to use ~/.my.cnf [client_ascl_root]
WP_DB_PASSWORD = ''
WP_DB_PORT = '3307'

# Legacy flags (kept for backwards compatibility)
USING_POSTGRESQL = False  # Set to True when migrating to PostgreSQL
USING_MYSQL = True

# ------------------------------
# Typesense Search Configuration
# ------------------------------
USING_TYPESENSE = True  # Enable Typesense search (falls back to MySQL if unavailable)

# Typesense server connection
TYPESENSE_HOST = 'localhost'
TYPESENSE_PORT = 8108
TYPESENSE_PROTOCOL = 'http'  # 'http' or 'https'
TYPESENSE_API_KEY = 'oWBN1v9zT9C3ZM48gblWobm4ibxcrFcn11hGpb3HiPzT9UOL'

# Typesense collection name
TYPESENSE_COLLECTION = 'codes'

# Search fallback behavior
TYPESENSE_FALLBACK_TO_MYSQL = True  # If True, falls back to MySQL LIKE search when Typesense is unavailable

# ---------------------------------------------------------------------
# Production-specific settings
# ---------------------------------------------------------------------

# Enable Sentry for error tracking in production (optional)
USING_SENTRY = False
SENTRY_DSN = "https://your-sentry-dsn-here"

# Running under Uvicorn
USING_UVICORN = True

# Flask security settings for production
SECRET_KEY = 'dcccc8298ddab7d71abfce56c6fe3c10be4d93f29968341f2c7269313bc6d02b'
SESSION_COOKIE_SECURE = False  # Set to True when using HTTPS
SESSION_COOKIE_HTTPONLY = True
SESSION_COOKIE_SAMESITE = 'Lax'

# Additional security headers
SEND_FILE_MAX_AGE_DEFAULT = 31536000  # 1 year for static files
