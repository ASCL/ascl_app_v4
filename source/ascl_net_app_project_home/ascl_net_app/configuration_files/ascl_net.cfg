#
# Production configuration for the ascl.net server (cPanel host).
#
# Standard MySQL on port 3306, v4 database.
# cPanel may prefix database/user names (e.g. 'asclnet_ascl_db').
#
# Usage:
#   export FLASK_CONFIG=ascl_net.cfg
#   python run_ascl_net_app.py
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

LOG_SQL_QUERIES = False
ENABLE_COLOR_LOGS = False

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True
DB_TYPE = 'mysql'

DB_DATABASE = 'ascl_db_v4'
DB_HOST = 'localhost'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf [client_ascl]
DB_PORT = '3306'

# WordPress database (read-only, same MySQL instance)
WP_DB_DATABASE = 'ascl_wordpress'
WP_DB_HOST = 'localhost'
WP_DB_USER = 'ascl_root'
WP_DB_PASSWORD = ''
WP_DB_PORT = '3306'

USING_POSTGRESQL = False
USING_MYSQL = True

# ------------------------------
# Typesense (remote, on trillian2)
# ------------------------------
USING_TYPESENSE = True
TYPESENSE_URL = 'http://127.0.0.1:8108'
TYPESENSE_COLLECTION = 'codes'
TYPESENSE_FALLBACK_TO_MYSQL = True

# ------------------------------
# Production settings
# ------------------------------
USING_SENTRY = False
SENTRY_DSN = ''
USING_UVICORN = False  # cPanel — not using Uvicorn

# SECRET_KEY and API keys loaded from /etc/ascl/secrets.cfg
SESSION_COOKIE_SECURE = False  # Set to True when using HTTPS
SESSION_COOKIE_HTTPONLY = True
SESSION_COOKIE_SAMESITE = 'Lax'
SEND_FILE_MAX_AGE_DEFAULT = 31536000  # 1 year for static files
