#
# MySQL configuration example
#
# Copy this to create your own MySQL configuration:
#   cp mysql_example.cfg my_mysql.cfg
#
# Then start the app with:
#   export FLASK_CONFIG=my_mysql.cfg
#   python run_ascl_net_app.py --debug
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# log raw SQL queries (useful for debugging)
LOG_SQL_QUERIES = False

ENABLE_COLOR_LOGS = True

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True

# Database type: 'mysql' or 'postgresql'
DB_TYPE = 'mysql'

# ------------------------------
# MySQL Connection Parameters
# ------------------------------
DB_DATABASE = 'ascl_db_v4'  # Upgraded database with InnoDB, FKs, and code_pk migration
DB_HOST = 'localhost'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf, or set password here
DB_PORT = '3307'  # Docker MySQL port (not standard 3306)

# Legacy flags (kept for backwards compatibility)
USING_POSTGRESQL = False
USING_MYSQL = True

# ---------------------------------------------------------------------
# Additional MySQL-specific options
# ---------------------------------------------------------------------

# MySQL connection charset (default: utf8mb4 for full Unicode support)
# DB_CHARSET = 'utf8mb4'

# MySQL connection options can be passed via the connection string
# For example, to set charset:
# Connection string format: mysql://user:pass@host:port/db?charset=utf8mb4

# ---------------------------------------------------------------------
# Other settings
# ---------------------------------------------------------------------

USING_SENTRY = False
SENTRY_DSN = "insert your Sentry DSN here, e.g. 'https://...'"
USING_UVICORN = True
