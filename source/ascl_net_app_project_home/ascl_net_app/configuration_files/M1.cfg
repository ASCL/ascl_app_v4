#
# MySQL configuration for M1.local (Demitri's Mac)
#
# This file is automatically loaded in debug mode based on hostname.
# It is gitignored to keep database credentials private.
#
# NOTE: Only all uppercase values are read!
# Ref: http://flask.pocoo.org/docs/api/#flask.Config
#

# log raw SQL queries (useful for debugging)
LOG_SQL_QUERIES = True

ENABLE_COLOR_LOGS = True

# ------------------------------
# Database configuration
# ------------------------------
USING_SQLALCHEMY = True

# Database type: 'mysql' or 'postgresql'
DB_TYPE = 'mysql'

# ------------------------------
# MySQL Connection Parameters
# ------------------------------
DB_DATABASE = 'ascl_db'
DB_HOST = '127.0.0.1'
DB_USER = 'ascl_db'
DB_PASSWORD = ''  # Leave empty to use ~/.my.cnf (preferring [client_ascl] group)
DB_PORT = '3307'  # Docker MySQL port on trillian server

# Legacy flags (kept for backwards compatibility)
USING_POSTGRESQL = False
USING_MYSQL = True

# ---------------------------------------------------------------------
# Debug settings
# ---------------------------------------------------------------------

USING_SENTRY = False
SENTRY_DSN = ""
USING_UVICORN = False  # Not needed in debug mode
