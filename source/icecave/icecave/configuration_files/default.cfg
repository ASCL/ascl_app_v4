# Icecave default configuration

# Database — SQLite for development
DB_TYPE = 'sqlite'
DB_PATH = '/data/ascl_icecave/icecave.db'

# Archive root directory
ARCHIVE_ROOT = '/data/ascl_icecave'

# API key for authentication (set in secrets.cfg for production)
# Leave empty to disable authentication (dev mode only)
API_KEY = ''

# Sync settings
SYNC_TIMEOUT_SECONDS = 600  # per-repo timeout for git operations
SYNC_PAUSE_SECONDS = 0.5    # pause between repos to avoid rate limiting
